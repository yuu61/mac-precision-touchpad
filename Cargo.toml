# Host workspace: pure (no WDK) logic crates that are unit-tested on the host,
# plus the `xtask` build/packaging tool.
#
[workspace]
resolver = "3"
members = [
    "crates/amtptp-core",
    "crates/amtptp-usb-bt",
    "tools/xtask",
]
exclude = ["drivers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.lints.clippy]
cargo = "deny"
