[package]
name = "xtask"
description = "Builds the Rust drivers and assembles the AmtPtpDevice driver package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

# Test-only: the INF test resolves every hardware ID of the INF templates to the model definitions of the
# driver it installs. The xtask binary itself stays std-only.
[dev-dependencies]
amtptp-hidfilter-core = { path = "../../crates/amtptp-hidfilter-core" }
amtptp-spikm-core = { path = "../../crates/amtptp-spikm-core" }
amtptp-usbkm-core = { path = "../../crates/amtptp-usbkm-core" }

[lints]
workspace = true
