# Kernel-mode driver workspace: KMDF 1.31 (Windows 10 21H2+), x64 and ARM64.
#
# Build from this directory. wdk-build locates this manifest by walking up
# from OUT_DIR to the first Cargo.lock, so keep the target dir in this workspace.
#
# Shared crates outside this workspace, used as path dependencies:
#   ../support/wdf-support  WDF glue (INIT helpers, context macro, request guard, IRP helpers)
#   ../support/rc-embed     build-dependency that compiles and links a VERSIONINFO .rc
#   ../../crates/*          hardware-independent core logic (host-tested)
[workspace]
resolver = "3"
members = [
    "AmtPtpDeviceUsbKm",
    "AmtPtpDeviceSpiKm",
    "AmtPtpHidFilter",
    "AmtPtpBthFilter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# Driver model for every crate in this workspace (incl. wdk-sys bindings and
# wdf-support's cfg). The INIT helpers use the compile-time size of WDF structs.
# A separate minimum version would require runtime structure sizes.
[workspace.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 31

[workspace.dependencies]
wdk = "=0.5.0"
# WDK API subsets used by the four driver crates.
wdk-sys = { version = "=0.5.2", features = ["hid", "usb", "spb"] }
wdk-panic = "=0.5.0"
wdk-build = "=0.6.0"
tracelogging = { version = "=1.2.4", default-features = false, features = ["etw", "macros", "kernel_mode"] }
wdf-support = { path = "../support/wdf-support" }
rc-embed = { path = "../support/rc-embed" }
ptp-hid = { path = "../../crates/ptp-hid" }
amtptp-usbkm-core = { path = "../../crates/amtptp-usbkm-core" }
amtptp-spikm-core = { path = "../../crates/amtptp-spikm-core" }
amtptp-hidfilter-core = { path = "../../crates/amtptp-hidfilter-core" }

# Lints are declared per member ([lints] in each driver crate), not as
# [workspace.lints]: Cargo warns (missing_lints_inheritance) for every local
# path dependency that does not inherit workspace lints, which would flag the
# core crates under ../../crates that belong to the root workspace.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
# Keep a full PDB for release drivers (crash-dump analysis), like the C
# Release configuration (/Zi + /DEBUG). Debug info does not change codegen.
debug = "full"
split-debuginfo = "packed"
strip = "none"
