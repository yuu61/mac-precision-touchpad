[package]
name = "amtptp-device-spi-km"
description = "AmtPtpDeviceSpiKm: KMDF Precision Touchpad driver for Apple SPI trackpads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
build = "build.rs"

[lib]
# Output file name: AmtPtpDeviceSpiKm.dll (+ AmtPtpDeviceSpiKm.pdb); packaging renames KM images to .sys.
name = "AmtPtpDeviceSpiKm"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdk.workspace = true
wdk-sys.workspace = true
wdk-panic.workspace = true
tracelogging.workspace = true
wdf-support.workspace = true
ptp-hid.workspace = true
amtptp-spikm-core.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# [lib] name must equal the C binary name (CamelCase).
non_snake_case = { level = "allow", priority = 1 }

[lints.clippy]
cargo = { level = "deny", priority = -1 }
# A panic in kernel mode is a bugcheck (wdk-panic -> KeBugCheckEx).
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
