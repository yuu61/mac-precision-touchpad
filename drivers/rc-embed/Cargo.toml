# Build-script helper (build-dependency only): compiles a Win32 resource script
# with the Windows SDK rc.exe that wdk-build already locates, and links the
# .res into the cdylib being built (KMDF .sys or UMDF .dll). Used by
# AmtPtpDeviceUsbKm and AmtPtpDeviceUsbUm for their VERSIONINFO resources.
# A member of neither driver workspace; pinned to the same wdk-build version.
[package]
name = "rc-embed"
description = "Compile a .rc file with the Windows SDK rc.exe and link the .res into a WDK cdylib (build scripts only)"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"

[lib]
test = false
doctest = false

[dependencies]
wdk-build = "=0.6.0"
