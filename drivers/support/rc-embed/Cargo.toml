# Build-script helper for generating the KMDF drivers' VERSIONINFO resources.
# Uses the same Windows SDK and wdk-build version as the driver workspace.
[package]
name = "rc-embed"
description = "Generate and link Windows driver VERSIONINFO resources"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"

[lib]
test = false
doctest = false

[dependencies]
wdk-build = "=0.6.0"

[lints.clippy]
cargo = { level = "deny", priority = -1 }
# Dependency versions are checked on the driver workspace that builds this crate.
multiple_crate_versions = "allow"
