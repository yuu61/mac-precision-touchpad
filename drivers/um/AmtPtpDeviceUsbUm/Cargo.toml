[package]
name = "amtptp-device-usb-um"
description = "AmtPtpDeviceUsbUm: UMDF Precision Touchpad driver for Apple USB trackpads (Magic Trackpad 2, MacBook)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-2.0-only"
build = "build.rs"

[lib]
# Output file name: AmtPtpDeviceUsbUm.dll (+ AmtPtpDeviceUsbUm.pdb); packaging renames KM images to .sys.
name = "AmtPtpDeviceUsbUm"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false

[build-dependencies]
wdk-build.workspace = true
rc-embed.workspace = true

[dependencies]
wdk.workspace = true
wdk-sys.workspace = true
wdk-panic.workspace = true
tracelogging.workspace = true
wdf-support.workspace = true
ptp-hid.workspace = true
amtptp-usbum-core.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# [lib] name must equal the C binary name (CamelCase).
non_snake_case = { level = "allow", priority = 1 }

[lints.clippy]
cargo = { level = "deny", priority = -1 }
# A panic in a WDF callback aborts WUDFHost (wdk_panic::install_panic_hook).
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
