# User-mode driver workspace: UMDF 2.15 (Windows 10 1709+), x64 and ARM64.
#
# wdk-build allows exactly ONE driver-model configuration per Cargo workspace
# (and per Cargo.lock), which is why the KMDF drivers live in ../km. Build from
# this directory; never set CARGO_TARGET_DIR / --target-dir (wdk-build locates
# this manifest by walking up from OUT_DIR to the first Cargo.lock).
#
# Shared crates outside this workspace, used as path dependencies:
#   ../support/wdf-support  WDF glue (INIT helpers, context macro, request guard)
#   ../support/rc-embed     build-dependency that compiles and links a VERSIONINFO .rc
#   ../../crates/*          hardware-independent core logic (host-tested)
[workspace]
resolver = "3"
members = ["AmtPtpDeviceUsbUm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# Driver model for every crate in this workspace (incl. wdk-sys bindings and
# wdf-support's cfg). UMDF 2.15 matches the C INF (UmdfLibraryVersion=2.15.0).
# Do NOT add minimum-umdf-version-minor (see wdf-support INIT helpers).
[workspace.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 15

[workspace.dependencies]
wdk = "=0.5.0"
wdk-sys = { version = "=0.5.2", features = ["hid", "usb", "spb"] }
wdk-panic = "=0.5.0"
wdk-build = "=0.6.0"
# User mode: default features (EventRegister/EventWriteTransfer).
tracelogging = "=1.2.4"
wdf-support = { path = "../support/wdf-support" }
rc-embed = { path = "../support/rc-embed" }
ptp-hid = { path = "../../crates/ptp-hid" }
amtptp-usbum-core = { path = "../../crates/amtptp-usbum-core" }

# Lints are declared per member ([lints] in each driver crate), not as
# [workspace.lints]: Cargo warns (missing_lints_inheritance) for every local
# path dependency that does not inherit workspace lints, which would flag the
# core crates under ../../crates that belong to the root workspace.

# Panic strategy: keep the default (unwind) here, unlike drivers/km. With
# panic = "abort", wdk-sys compiles stub __CxxFrameHandler3/4 and
# __GSHandlerCheck_EH4 (which return ExceptionContinueExecution) that displace
# vcruntime's real handlers in this DLL, so an SEH exception escaping a callee
# of DriverEntry or of the static UCRT would loop instead of reaching the
# WUDFHost crash path as it does for the C driver. Panics still never unwind
# into WDF: DriverEntry installs wdk_panic's hook, which aborts the host process.
[profile.release]
lto = true
# Keep a full PDB for release (crash-dump analysis), like the C Release
# configuration. Debug info does not change codegen.
debug = "full"
split-debuginfo = "packed"
strip = "none"
